[features]
seeds = false
skip-lint = false

[programs.localnet]
king_of_the_hill = "Your_Program_ID_here"

[programs.devnet]
king_of_the_hill = "Your_Program_ID_here"

[programs.mainnet]
king_of_the_hill = "Your_Program_ID_here"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"

[test]
startup_wait = 10000
shutdown_wait = 2000
upgradeable = false

[test.validator]
bind_address = "0.0.0.0"
url = "https://api.mainnet-beta.solana.com"
ledger = ".anchor/test-ledger"
rpc_port = 8899

